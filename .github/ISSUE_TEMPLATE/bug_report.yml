name: Bug report
about: Report a reproducible problem in OPP
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        感谢提交问题。安全漏洞请先阅读 SECURITY.md，不要在公开 Issue 中放出可利用细节。
  - type: textarea
    id: problem
    attributes:
      label: 发生了什么？
      description: 请描述实际行为。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 最小复现步骤
      description: 尽量给出最小命令、输入文件或仓库片段。
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 你原本期待什么？
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OPP 版本 / commit
      placeholder: 0.3.0.dev1 / commit SHA
  - type: input
    id: environment
    attributes:
      label: 环境
      placeholder: OS, Python version
  - type: textarea
    id: evidence
    attributes:
      label: 输出、receipt 或日志
      description: 请删掉密钥、令牌、个人数据和其他敏感信息。
      render: shell
