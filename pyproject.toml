[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taowind-opp"
version = "0.2.0.dev1"
description = "TaoWind Open Reality Protocols reference candidate / 道风开放现实协议族参考候选实现"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.23"]

[project.scripts]
opp = "opp.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opp = ["resources/registry/*.json", "resources/schemas/*.json"]
